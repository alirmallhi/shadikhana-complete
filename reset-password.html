<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Rishta Square</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
<meta name="description" content="Set a new password for your Rishta Square account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --burgundy:#1A1225; --rose:#B8975A; --gold:#B8975A;
    --cream:#FFFAF3; --ivory:#FCF0DE; --charcoal:#1A1225;
    --mid:#6B6478; --light:#EEDFC4; --white:#FFFFFF; --green:#0FA26B;
    --ink:#081B2E; --ink-2:#0F2C47; --hairline:#F0DCB8;
    --font-display:'Fraunces',serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  body{font-family:var(--font-body);background:var(--cream);color:var(--charcoal);overflow-x:hidden;min-height:100vh}
  a{color:inherit}

  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 5%;height:72px;background:rgba(250,246,238,0.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--hairline)}
  .nav-logo{display:flex;align-items:center;gap:11px;font-family:var(--font-display);font-size:1.5rem;font-weight:600;color:var(--burgundy);text-decoration:none;letter-spacing:-.01em}
  .logo-icon{height:38px;width:auto;flex-shrink:0}
  .back-link{font-size:.86rem;font-weight:600;color:var(--mid);text-decoration:none;display:flex;align-items:center;gap:.4rem}
  .back-link:hover{color:var(--burgundy)}

  .auth-wrap{max-width:420px;margin:0 auto;padding:160px 5% 100px}
  .auth-label{display:inline-block;background:var(--ink);color:var(--gold);padding:.4rem 1rem;border-radius:20px;font-size:.72rem;font-weight:600;letter-spacing:.09em;margin-bottom:1.3rem;text-transform:uppercase;font-family:var(--font-mono)}
  .auth-wrap h1{font-family:var(--font-display);font-size:clamp(1.7rem,3vw,2.2rem);font-weight:600;line-height:1.15;margin-bottom:.6rem}
  .auth-sub{color:var(--mid);font-size:.92rem;margin-bottom:2rem;line-height:1.6}

  .form-group{margin-bottom:1.2rem}
  .form-group label{display:block;font-size:.8rem;font-weight:600;margin-bottom:.4rem;color:var(--charcoal)}
  .form-group input{width:100%;padding:.8rem 1rem;border:1.5px solid var(--light);border-radius:10px;font-size:.92rem;font-family:inherit;color:var(--charcoal);background:var(--white);outline:none;transition:border-color .2s}
  .form-group input:focus{border-color:var(--rose)}

  .btn-primary{width:100%;background:var(--ink);color:#fff;padding:.9rem;border-radius:10px;font-weight:600;font-size:.9rem;border:none;cursor:pointer;transition:opacity .2s}
  .btn-primary:hover{opacity:.9}
  .btn-primary:disabled{opacity:.6;cursor:not-allowed}

  .auth-message{margin-top:1.3rem;padding:1rem 1.1rem;border-radius:10px;font-size:.88rem;line-height:1.6;display:none}
  .auth-message.show{display:block}
  .auth-message.success{background:#E8F5F0;color:#0F5C3E}
  .auth-message.error{background:#FDECEC;color:#B23A3A}

  footer{background:var(--ink);color:rgba(255,255,255,0.6);text-align:center;padding:2.5rem 5%;font-size:.82rem;position:fixed;bottom:0;left:0;right:0}
  footer a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo"><img src="/assets/images/rs-logo-header.png" alt="Rishta Square" class="logo-icon">Rishta Square</a>
  <a href="/index.html" class="back-link">← Back to Home</a>
</nav>

<div class="auth-wrap">
  <div class="auth-label">Account Recovery</div>
  <h1 id="rp-title">Reset Your Password</h1>
  <p class="auth-sub" id="rp-sub">Enter a new password for your account.</p>

  <div id="rp-form">
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="rp-new" placeholder="At least 6 characters" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label>Confirm New Password</label>
      <input type="password" id="rp-confirm" autocomplete="new-password">
    </div>
    <button class="btn-primary" id="rp-btn" onclick="submitResetPassword()">Reset Password</button>
  </div>

  <div class="auth-message" id="rp-message"></div>
</div>

<script src="/api.js"></script>
<script src="/passwordRules.js"></script>
<script>
var resetToken = new URLSearchParams(window.location.search).get('token');

if (!resetToken) {
  document.getElementById('rp-form').style.display = 'none';
  var msgEl = document.getElementById('rp-message');
  msgEl.className = 'auth-message show error';
  msgEl.textContent = 'This reset link is missing its token. Please request a new one from the Forgot Password page.';
}

async function submitResetPassword() {
  var next    = document.getElementById('rp-new').value;
  var confirm = document.getElementById('rp-confirm').value;
  var btn     = document.getElementById('rp-btn');
  var msgEl   = document.getElementById('rp-message');

  msgEl.className = 'auth-message';

  var check = validateNewPassword(next, confirm);
  if (!check.valid) {
    msgEl.classList.add('show', 'error');
    msgEl.textContent = check.message;
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Resetting...';

  try {
    var result = await apiCall('/auth/reset-password', 'POST', { token: resetToken, new_password: next });

    if (result.success) {
      document.getElementById('rp-form').style.display = 'none';
      document.getElementById('rp-title').textContent = 'Password Reset';
      document.getElementById('rp-sub').textContent = '';
      msgEl.classList.add('show', 'success');
      msgEl.textContent = 'Your password has been reset. Redirecting you to Sign In...';
      setTimeout(function() { window.location.href = '/index.html'; }, 2500);
    } else {
      btn.disabled = false;
      btn.textContent = 'Reset Password';
      msgEl.classList.add('show', 'error');
      msgEl.textContent = result.message || 'This reset link is invalid or has expired. Please request a new one.';
    }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Reset Password';
    msgEl.classList.add('show', 'error');
    msgEl.textContent = 'Something went wrong. Please try again.';
  }
}
</script>
</body>
</html>
